name: test

on:
  push:
    branches: [master]
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: .ruby-version
          bundler-cache: true
      - name: Run lint
        run: bundle exec rubocop
      - name: Build gem
        run: gem build bitflyer-cli.gemspec
      - name: Test release version bumps
        run: bash test/release_bump.sh

  test:
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        include:
          - ruby: .ruby-version
            gemfile: gemfiles/with_coverage/Gemfile
            coverage: 'true'
          - ruby: '3.3.14'
            gemfile: gemfiles/with_coverage/Gemfile
            coverage: 'true'
          - ruby: '3.3.14'
            gemfile: Gemfile
            coverage: 'false'
    env:
      BUNDLE_GEMFILE: ${{ matrix.gemfile }}
      BUNDLE_FROZEN: 'true'
    steps:
      - uses: actions/checkout@v7
      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ matrix.ruby }}
          bundler-cache: true
      - name: Run test
        env:
          COVERAGE: ${{ matrix.coverage }}
        run: bundle exec rspec
      - name: Report coverage
        if: matrix.coverage == 'true'
        run: |
          report=$(bundle exec simplecov status --no-color)
          printf '### Test coverage\n\n```text\n%s\n```\n' "$report" >> "$GITHUB_STEP_SUMMARY"
