name: test

on:
  push:
    branches: [master]
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.4.4'
      - name: Install dependencies
        run: bundle install --jobs 4
      - name: Run lint
        run: bundle exec rubocop

  test:
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        include:
          - ruby: '3.4.4'
            gemfile: gemfiles/with_coverage/Gemfile
            coverage: 'true'
          - ruby: '3.3.13'
            gemfile: gemfiles/with_coverage/Gemfile
            coverage: 'true'
          - ruby: '3.2.11'
            gemfile: Gemfile
            coverage: 'false'
          - ruby: '3.1.7'
            gemfile: Gemfile
            coverage: 'false'
    env:
      BUNDLE_GEMFILE: ${{ matrix.gemfile }}
      BUNDLE_FROZEN: 'true'
    steps:
      - uses: actions/checkout@v7
      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ matrix.ruby }}
      - name: Install dependencies
        run: bundle install --jobs 4
      - name: Run test
        env:
          COVERAGE: ${{ matrix.coverage }}
        run: bundle exec rspec
