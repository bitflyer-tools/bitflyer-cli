name: release

on:
  workflow_dispatch:
    inputs:
      version:
        description: Release version
        required: true
        type: choice
        options:
          - major
          - minor
          - patch
jobs:
  push:
    name: Push gem to RubyGems.org
    runs-on: ubuntu-24.04
    environment:
      name: release
    permissions:
      id-token: write
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Ruby
        uses: ruby/setup-ruby@20eb24b0d509e2b9ed9b6d42ddfeb992915e0564 # v1.341.0
        with:
          bundler-cache: true
          ruby-version: .ruby-version
      - name: Setup Git
        run: |
          git config --global user.email "unhappychoice@gmail.com"
          git config --global user.name "Yuji Ueki"
      - name: Bump version
        env:
          RELEASE_VERSION: ${{ inputs.version }}
        run: >-
          bash .github/release/bump.sh "$RELEASE_VERSION" --message ':tada: Bump %{name} to %{version}'
      - name: Update project lockfile
        run: |
          bundle config set frozen false && bundle install
          git add . && git commit --amend --no-edit
      - uses: rubygems/release-gem@5c53f5308233b7c0f47411f0471b3faae6fa57b2 # v1.4.2
