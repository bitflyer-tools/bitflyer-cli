version: 2
updates:
  - package-ecosystem: bundler
    directories:
      - "/"
      - "/gemfiles/with_coverage"
      - "/.github/release"
    schedule:
      interval: daily
      time: "12:00"
      timezone: Asia/Tokyo
    open-pull-requests-limit: 20
    allow:
      - dependency-type: direct
      - dependency-type: indirect
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
